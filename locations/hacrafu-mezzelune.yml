---

location: hacrafu-mezzelune
location_nice: M
latitude: 52.483195120196 # mining stage area
longitude: 13.816632628437 # mining stage area
contact_name: "Hacken Craften Funken e.V."
contact_nickname: "HaCraFu e.V."
contacts:
  - "freifunk@hacrafu.de"

hosts:
  - hostname: hacrafu-mezzelune
    role: corerouter
    model: "zyxel_wsm20"
    wireless_profile: disable
    host__rclocal__to_merge:
      - |
        uci set network.vlan_40.ports='lan1:u lan2:u lan3:u'
        uci set network.vlan_42.ports='lan1:t lan2:t lan3:t'
        uci set network.vlan_50.ports='wan:u'
        uci commit network; reload_config

ipv6_prefix: "2001:bf7:850:6500::/56"

# DHCP      10.248.156.128/25
# MGMT      10.31.24.63/32
# TUNNEL    10.248.84.160/31

networks:
  # DHCP
  - vid: 40
    role: dhcp
    inbound_filtering: true
    enforce_client_isolation: true
    prefix: 10.248.156.128/25
    ipv6_subprefix: 0
    assignments:
      hacrafu-mezzelune: 1
      fw: 2

  # MGMT
  - vid: 42
    role: mgmt
    prefix: 10.31.24.63/32
    gateway: 1
    dns: 1
    ipv6_subprefix: 1
    assignments:
      hacrafu-mezzelune: 1

  # UPLINK
  - vid: 50
    role: uplink
    ingress: 20
    egress: 20

  - role: tunnel
    ifname: ts_wg0
    mtu: 1280
    prefix: 10.31.32.208/32
    wireguard_port: 51820

  - role: tunnel
    ifname: ts_wg1
    mtu: 1280
    prefix: 10.31.32.209/32
    wireguard_port: 51821

