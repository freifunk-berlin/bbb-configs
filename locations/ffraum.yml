---

location: ffraum
location_nice: Freifunk-Raum @ Lause
latitude: 52.497441
longitude: 13.427841
contact_nickname: Stadtfunk gGmbH
contacts:
  - noc@stadtfunk.net

hosts:
  - hostname: ffraum-core
    role: corerouter
    model: ubnt_usw-flex
    host__rclocal__to_merge:
      - |
        uci set network.vlan_40.ports='lan1:t lan2:u lan3:t lan4:t lan5:t'
        uci set network.vlan_50.ports='lan1:u lan2:t lan3:t lan4:u lan5:u'
        uci commit network; reload_config

  - hostname: ffraum-ap1
    role: ap
    model: zyxel_nwa50ax
    wireless_profile: freifunk_ffraum

# 10.248.46.0/24
# 10.248.46.0/27    - mgmt  - vlan 42
# 10.248.46.32/27   - mesh  - tunnel
# 10.248.46.64/27   - lab   - vlan 41
# 10.248.46.96/27   - free
# 10.248.46.128/25  - dhcp  - vlan 40
ipv6_prefix: 2001:bf7:830:e700::/56

networks:
  - vid: 40
    name: dhcp
    role: dhcp
    prefix: 10.248.46.128/25
    ipv6_subprefix: -1
    inbound_filtering: true
    enforce_client_isolation: true
    assignments:
      ffraum-core: 1

  - vid: 41
    name: lab
    role: dhcp
    prefix: 10.248.46.64/27
    ipv6_subprefix: -2
    inbound_filtering: false
    enforce_client_isolation: false
    no_corerouter_dns_record: true
    assignments:
      ffraum-core: 1

  - vid: 42
    name: mgmt
    role: mgmt
    prefix: 10.248.46.0/27
    ipv6_subprefix: 1
    gateway: 1
    dns: 1
    assignments:
      ffraum-core: 1
      ffraum-ap1: 2
      ffraum-uplink: 3
      testlab01: 30

  - vid: 50
    untagged: true
    role: uplink

  - role: tunnel
    ifname: ts_wg0
    mtu: 1280
    prefix: 10.248.46.32/32
    wireguard_port: 51820

  - role: tunnel
    ifname: ts_wg1
    mtu: 1280
    prefix: 10.248.46.33/32
    wireguard_port: 51821

location__wireless_profiles__to_merge:
  - name: freifunk_ffraum
    ifaces:
      - mode: ap
        ssid: lause.freifunk.net
        encryption: none
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: ff

      - mode: ap
        ssid: lause.freifunk.net Encrypted
        encryption: owe
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: ffowe
        ieee80211w: 2

      - mode: ap
        ssid: test-lab
        encryption: psk2
        key: "file:/root/wifi_pass"
        network: lab
        radio: [11a_standard, 11g_standard]
        ifname_hint: lab

# AP-id, wifi-channel, bandwidth, txpower
location__channel_assignments_11g_standard__to_merge:
  ffraum-ap1: 1-20
