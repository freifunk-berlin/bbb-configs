---

location: hacrafu-orecchiette
location_nice: An der Stadtmauer 7, 15344 Strausberg
latitude: 52.582152312
longitude: 13.883028030
contact_name: "Hacken Craften Funken e.V."
contact_nickname: "HaCraFu e.V."
contacts:
  - "freifunk@hacrafu.de"

hosts:
  - hostname: hacrafu-orecchiette
    role: corerouter
    model: "genexis_pulse-ex400"
    wireless_profile: freifunk_hacrafu

  - hostname: hacrafu-orecchiette-park
    role: ap
    model: "cudy_ap3000outdoor-v1"
    wireless_profile: freifunk_hacrafu

ipv6_prefix: "2001:bf7:850:6e00::/56"
# DHCP      10.31.171.32/28
# MESH      10.31.168.108/30
# MGMT      10.31.171.184/30
# TUNNEL    10.31.168.106/31

networks:
  # MESH - 5 GHz 802.11s
  - vid: 20
    role: mesh
    name: mesh_5g
    prefix: 10.31.168.108/32
    ipv6_subprefix: -20
    mesh_ap: hacrafu-orecchiette
    mesh_radio: 11a_standard
    mesh_iface: mesh

  # MESH - 2.4 GHz 802.11s
  - vid: 21
    role: mesh
    name: mesh_2g
    prefix: 10.31.168.109/32
    ipv6_subprefix: -21
    mesh_ap: hacrafu-orecchiette
    mesh_radio: 11g_standard
    mesh_iface: mesh

  # MESH - 5 GHz 802.11s - AP Park
  - vid: 22
    role: mesh
    name: mesh_5g_park
    prefix: 10.31.168.110/32
    ipv6_subprefix: -22
    mesh_ap: hacrafu-orecchiette-park
    mesh_radio: 11a_standard
    mesh_iface: mesh

  # MESH - 2.4 GHz 802.11s - AP Park
  - vid: 23
    role: mesh
    name: mesh_2g_park
    prefix: 10.31.168.111/32
    ipv6_subprefix: -23
    mesh_ap: hacrafu-orecchiette-park
    mesh_radio: 11g_standard
    mesh_iface: mesh

  # DHCP
  - vid: 40
    role: dhcp
    inbound_filtering: true
    enforce_client_isolation: true
    prefix: 10.31.171.32/28
    ipv6_subprefix: 0
    assignments:
      hacrafu-orecchiette: 1

  # MGMT
  - vid: 42
    role: mgmt
    prefix: 10.31.171.184/30
    gateway: 1
    dns: 1
    ipv6_subprefix: 1
    assignments:
      hacrafu-orecchiette: 1 # 185
      hacrafu-orecchiette-park: 2 # 186

  # UPLINK
  - vid: 50
    role: uplink
    untagged: true

  - role: tunnel
    ifname: ts_wg0
    mtu: 1280
    prefix: 10.31.168.106/32
    wireguard_port: 51820

  - role: tunnel
    ifname: ts_wg1
    mtu: 1280
    prefix: 10.31.168.107/32
    wireguard_port: 51821

# AP-id, wifi-channel, bandwidth, txpower
location__channel_assignments_11a_standard__to_merge:
  hacrafu-orecchiette: 36-40
  hacrafu-orecchiette-park: 36-40

# AP-id, wifi-channel, bandwidth, txpower
location__channel_assignments_11g_standard__to_merge:
  hacrafu-orecchiette: 13-20
  hacrafu-orecchiette-park: 13-20

