---

location: otto
location_nice: "Pekrunstr."
latitude: 52.5376754
longitude: 13.55436
altitude: 0
contact_nickname: "Nick"
contacts:
  - "@schnick:matrix.org"

adblock_enabled: true
adblock_provider: lean
adblock_lean_dnsmasq_instances: [default, vrf_freifunk]

# keep the DSCP values the devices set for UDP traffic without a rule
qosify_dscp_default_udp: "+besteffort"
# downloads over SSH and clients which don't mark SSH go into best effort,
# OpenSSH marks interactive sessions and transfers itself
qosify_rules:
  - "tcp:22 +besteffort"

# needed for the private network with direct internet access
bird_only: true

hosts:
  - hostname: otto-core
    role: corerouter
    model: "avm_fritzbox-7530"
    wireless_profile: otto
    # for the VRF support of procd, dnsmasq, dropbear and uhttpd, collectd
    # can't reach the mesh until it supports VRFs as well
    openwrt_version: snapshot

# Router: 10.31.203.0/25 2001:bf7:850:6300::/56
# --MGMT: 10.31.203.0/28
# --DHCP (public wifi, tunneled to mesh): 10.31.203.32/27
# --PRIVATE (Feel zu spaet, direct internet via VDSL): 10.31.203.64/27

ipv6_prefix: "2001:bf7:850:6300::/56"

# stable addresses for the private network, the VDSL prefix is dynamic
ula_prefix: "fd6f:c8f8:829d::/48"

# keep the log on a USB stick
log_usb: true
# and write status snapshots to it
log_status: true

dsl:
  annex: j
  tone: b
  xfer_mode: ptm
  line_mode: vdsl

networks:
  # Easybell VDSL, used by the tunnel and by the private network
  - role: uplink
    name: wan
    ifname: dsl0
    vid: 7
    uplink_mode: root
    uplink_proto: pppoe
    ipv6_reqaddress: try
    ipv6_default_route: true
    ipv6_norelease: true
    pppoe_username: "file:/root/pppoe_user"
    pppoe_password: "file:/root/pppoe_pass"
    qos_engine: qosify
    qosify_overhead_type: pppoe-ptm
    qosify_overhead_vlan: 1
    ingress: 95
    egress: 38

  - role: tunnel
    ifname: ts_wg0
    mtu: 1280
    prefix: 10.31.203.126/32
    wireguard_port: 51820

  - vid: 40
    role: dhcp
    prefix: 10.31.203.32/27
    ipv6_subprefix: 0
    inbound_filtering: true
    enforce_client_isolation: true
    assignments:
      otto-core: 1

  # Private wifi, uses the VDSL line directly instead of Freifunk
  - vid: 41
    role: dhcp
    name: private
    untagged: true
    prefix: 10.31.203.64/27
    inbound_filtering: true
    enforce_client_isolation: false
    no_corerouter_dns_record: true
    direct_internet: true
    ip6class: [wan6, local]
    assignments:
      otto-core: 1

  - vid: 42
    role: mgmt
    prefix: 10.31.203.0/28
    gateway: 1
    dns: 1
    ipv6_subprefix: 1
    assignments:
      otto-core: 1

location__wireless_profiles__to_merge:
  - name: otto
    ifaces:
      - mode: ap
        ssid: berlin.freifunk.net
        encryption: none
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: ff
        owe_transition_ifname_hint: ffowe
        disassoc_low_ack: 0

      - mode: ap
        ssid: berlin.freifunk.net OWE
        hidden: true
        encryption: owe
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: ffowe
        owe_transition_ifname_hint: ff
        ieee80211w: 2
        disassoc_low_ack: 0

      - mode: ap
        ssid: "Feel zu spaet"
        encryption: sae
        key: "file:/root/wifi_pass"
        network: private
        radio: [11a_standard, 11g_standard]
        ifname_hint: pr
        ieee80211w: 2
        ieee80211r: true
        disassoc_low_ack: 0

location__channel_assignments_11a_standard__to_merge:
  otto-core: "100-80"

location__channel_assignments_11g_standard__to_merge:
  otto-core: "13-20"

# only place this ssh-keys
ssh_keys:
  - comment: Nick
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJrryeA5Nj8TJzX0hjujDQvrrBRpDFjhGJKn297zhoij nick@systemli.org
