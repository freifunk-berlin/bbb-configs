---

location: hacrafu-chifferi
location_nice: A
# latitude: 52.0
# longitude: 13.0
contact_name: "Hacken Craften Funken e.V."
contact_nickname: "HaCraFu e.V."
contacts:
  - "freifunk@hacrafu.de"

hosts:
  - hostname: hacrafu-chifferi
    role: corerouter
    model: "genexis_pulse-ex400"
    wireless_profile: disable
    host__rclocal__to_merge:
      - |
        uci set network.vlan_40.ports='lan:u'
        uci set network.vlan_42.ports='lan:t'
        uci set network.vlan_50.ports='wan:u'
        uci commit network; reload_config

ipv6_prefix: "2001:bf7:850:6c00::/56"

# DHCP      10.248.146.192/27
# MGMT      10.31.168.33/32
# TUNNEL    10.31.168.34/31

networks:
  # DHCP
  - vid: 40
    role: dhcp
    inbound_filtering: true
    enforce_client_isolation: true
    prefix: 10.248.146.192/27
    ipv6_subprefix: 0
    assignments:
      hacrafu-chifferi: 1

  # MGMT
  - vid: 42
    role: mgmt
    prefix: 10.31.168.33/32
    gateway: 1
    dns: 1
    ipv6_subprefix: 1
    assignments:
      hacrafu-chifferi: 1

  # UPLINK
  - vid: 50
    role: uplink
    igress: 30
    egress: 30

  - role: tunnel
    ifname: ts_wg0
    mtu: 1280
    prefix: 10.31.168.34/32
    wireguard_port: 51820

  - role: tunnel
    ifname: ts_wg1
    mtu: 1280
    prefix: 10.31.168.35/32
    wireguard_port: 51821

