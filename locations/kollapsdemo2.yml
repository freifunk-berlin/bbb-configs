---

location: kollapsdemo2
location_nice:
community: berlin

hosts:
  - hostname: kollapsdemo2-core
    role: corerouter
    model: "glinet_gl-mt1300"
    wireless_profile: freifunk_default


# 10.31.174.128/26 - OLD
# - 10.31.174.128/29 - mgmt
# - 10.31.174.136/29 - mesh
# - 10.31.174.144/28 - prdhcp
# - 10.31.174.160/27 - dhcp
ipv6_prefix: 2001:bf7:750:5500::/56

networks:
  # MESH - PtP antenna 1
  - vid: 10
    role: mesh
    name: mesh_ptp_1
    prefix: 10.31.174.136/32
    ipv6_subprefix: -10
    ptp: true

  # MESH - PtP antenna 2
  - vid: 11
    role: mesh
    name: mesh_ptp_2
    prefix: 10.31.174.137/32
    ipv6_subprefix: -11
    ptp: true

  # MESH - 5 GHz 802.11s
  - vid: 20
    role: mesh
    name: mesh_5g_core
    prefix: 10.31.174.138/32
    ipv6_subprefix: -20
    mesh_ap: kollapsdemo2-core
    mesh_radio: 11a_standard
    mesh_iface: mesh

  # MESH - 2.4 GHz 802.11s
  - vid: 21
    role: mesh
    name: mesh_2g_core
    prefix: 10.31.174.139/32
    ipv6_subprefix: -21
    mesh_ap: kollapsdemo2-core
    mesh_radio: 11g_standard
    mesh_iface: mesh

# MESH - Lan
  - vid: 30
    untagged: true
    role: mesh
    name: mesh_lan
    prefix: 10.31.174.144/32
    ipv6_prefix: -30

  - vid: 40
    name: dhcp
    role: dhcp
    inbound_filtering: false
    enforce_client_isolation: false
    prefix: 10.31.174.160/27
    ipv6_subprefix: 2
    assignments:
      kollapsdemo2-core: 1

  - vid: 42
    role: mgmt
    prefix: 10.31.174.128/29
    gateway: 1
    dns: 1
    ipv6_subprefix: 42
    assignments:
      kollapsdemo2-core: 1

