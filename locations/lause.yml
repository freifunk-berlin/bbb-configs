---

location: lause
location_nice: Roof, Lausitzer Straße 10, 10999 Berlin
latitude: 52.497415
longitude: 13.428319
contact_nickname: Stadtfunk gGmbH
contacts:
  - noc@stadtfunk.net

hosts:
  - hostname: lause-core
    role: corerouter
    model: mikrotik_routerboard-750gr3
    bird__packages__to_merge:
      - bird3-babelpatch
      - bird3c

  - hostname: lause-ap1
    role: ap
    model: "zyxel_nwa55axe"
    wireless_profile: ap_only

  - hostname: lause-ap2
    role: ap
    model: "zyxel_nwa55axe"
    wireless_profile: ap_only

  - hostname: lause-sw-1
    role: ap # Switch
    model: hasivo_s1300wp-8xgt-4s-plus
    wireless_profile: none

snmp_devices:

  - hostname: lause-sw-core
    address: 10.248.106.242
    snmp_profile: edgeswitch

  - hostname: lause-sw-5
    address: 10.248.106.246
    snmp_profile: swos_lite


  - hostname: lause-emma
    address: 10.248.106.243
    snmp_profile: mikrotik_60g


# Router: 10.248.106.192/26
# --DHCP: 10.248.106.192/27
# --MESH: 10.248.106.224/28
# --MGMT: 10.248.106.240/28
ipv6_prefix: 2001:bf7:831:a00::/56

networks:
  - vid: 10
    role: mesh
    name: mesh_emma
    prefix: 10.248.106.224/32
    ipv6_subprefix: -10

  - vid: 20
    role: mesh
    name: mesh_local
    prefix: 10.248.106.225/32
    ipv6_subprefix: -20

  - vid: 40
    name: dhcp
    role: dhcp
    prefix: 10.248.106.192/27
    ipv6_subprefix: 0
    inbound_filtering: true
    enforce_client_isolation: true
    assignments:
      lause-core: 1

  - vid: 42
    name: mgmt
    role: mgmt
    prefix: 10.248.106.240/28
    ipv6_subprefix: 1
    gateway: 1
    dns: 1
    assignments:
      lause-core: 1
      lause-sw-core: 2
      lause-emma: 3
      lause-ap1: 4
      lause-ap2: 5
      lause-sw-1: 7
      lause-sw-5: 6
