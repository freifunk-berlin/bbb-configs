---

location: rhxb
location_nice: Rathaus Kreuzberg
latitude: 52.493778
longitude: 13.385290
altitude: 74
community: berlin

hosts:
  - hostname: rhxb-core
    role: corerouter
    model: "linksys_e8450-ubi"
    wireless_profile: freifunk_default
    host__rclocal__to_merge:
      - |
        uci -q get system.@system[0].bbb_config_first_boot > /dev/null
        if [ "1" -eq $? ]; then
          # add domain for the bbb unifi controller
          uci set dhcp.unifi=domain
          uci set dhcp.unifi.ip=10.31.130.157
          uci set dhcp.unifi.name=unifi
          uci commit dhcp
          /etc/init.d/dnsmasq restart
          # Prevent this from running again by setting a config option
          uci set system.@system[0].bbb_config_first_boot=1
          uci commit system
          # reload the config to accept these changes
          reload_config
        fi

snmp_devices:
  - hostname: rhxb-switch-roof # EdgeSwitch 24 250W
    address: 10.31.126.2
    snmp_profile: "edgeswitch"

  - hostname: rhxb-l105 # airFiber 60 LR
    address: 10.31.126.4
    snmp_profile: "af60"

  - hostname: rhxb-flughafen # airFiber 60 LR
    address: 10.31.126.5
    snmp_profile: "af60"

  - hostname: rhxb-manstein # NanoBridge M5
    address: 10.31.126.6
    snmp_profile: "airos_6"

  - hostname: rhxb-rhnk # airFiber 60 LR
    address: 10.31.126.8
    snmp_profile: "af60"

  - hostname: rhxb-technikmuseum # PowerBeam 5AC ISO
    address: 10.31.126.9
    snmp_profile: "airos_8"

  - hostname: rhxb-no-5ghz # Rocket 5AC Lite
    address: 10.31.126.10
    snmp_profile: "airos_8"

  - hostname: rhxb-sw-5ghz # Rocket 5AC Lite
    address: 10.31.126.12
    snmp_profile: "airos_8"

  - hostname: rhxb-so-5ghz # Rocket 5AC Lite
    address: 10.31.126.13
    snmp_profile: "airos_8"

  - hostname: rhxb-simeon # PowerBeam 5AC 400
    address: 10.31.126.14
    snmp_profile: "airos_8"

  - hostname: rhxb-nw-5ghz # Rocket 5AC Lite
    address: 10.31.126.15
    snmp_profile: "airos_8"

  - hostname: rhxb-dragon # NanoBeam 5AC
    address: 10.31.126.17
    snmp_profile: "airos_8"

airos_dfs_reset:
  - name: "rhxb-simeon"
    target: "10.31.126.14"
    username: "ubnt"
    password: "file:/root/pwd"
    daytime_limit: "2-7"

  - name: "rhxb-nw-5ghz"
    target: "10.31.126.15"
    username: "ubnt"
    password: "file:/root/pwd"
    daytime_limit: "2-7"

  - name: "rhxb-dragon"
    target: "10.31.126.17"
    username: "ubnt"
    password: "file:/root/pwd"
    daytime_limit: "2-7"

ipv6_prefix: "2001:bf7:830:9f00::/56"

# Rhxb got following prefixes:
# DHCP: 10.31.128.0/23
# Router: 10.31.126.0/24
# --MGMT: 10.31.126.0/25
# --MESH: 10.31.126.128/28 {as /32}

# Disable noping as we use dhcp and static assignments
# both in mgmt network
dhcp_no_ping: false

networks:
  - vid: 10
    role: mesh
    name: mesh_l105
    prefix: 10.31.126.128/32
    ipv6_subprefix: -1
    mesh_metric: 128
    ptp: true

  - vid: 11
    role: mesh
    name: mesh_flughafen
    prefix: 10.31.126.129/32
    ipv6_subprefix: -2
    mesh_metric: 128
    ptp: true

  - vid: 12
    role: mesh
    name: mesh_rhnk
    prefix: 10.31.126.130/32
    ipv6_subprefix: -3
    mesh_metric: 128
    ptp: true

  - vid: 14
    role: mesh
    name: mesh_manstein
    prefix: 10.31.126.132/32
    ipv6_subprefix: -5
    ptp: true

  - vid: 15
    role: mesh
    name: mesh_simeon
    prefix: 10.31.126.133/32
    ipv6_subprefix: -6
    ptp: true

  - vid: 16
    role: mesh
    name: mesh_technik
    prefix: 10.31.126.134/32
    ipv6_subprefix: -7
    ptp: true

  - vid: 17
    role: mesh
    name: mesh_dragon
    prefix: 10.31.126.140/32
    ipv6_subprefix: -8

  - vid: 20
    role: mesh
    name: mesh_no_5ghz
    prefix: 10.31.126.135/32
    ipv6_subprefix: -20

  - vid: 22
    role: mesh
    name: mesh_sw_5ghz
    prefix: 10.31.126.137/32
    ipv6_subprefix: -22

  - vid: 23
    role: mesh
    name: mesh_so_5ghz
    prefix: 10.31.126.138/32
    ipv6_subprefix: -23

  - vid: 24
    role: mesh
    name: mesh_nw_5ghz
    prefix: 10.31.126.139/32
    ipv6_subprefix: -24

  - vid: 40
    role: dhcp
    inbound_filtering: true
    enforce_client_isolation: true
    prefix: 10.31.128.0/23
    ipv6_subprefix: 0
    assignments:
      rhxb-core: 1

  - vid: 42
    name: mgmt
    role: dhcp # we wanna do dhcp for the access points
    prefix: 10.31.126.0/25
    gateway: 1
    dns: 1
    ipv6_subprefix: 1
    assignments:
      rhxb-core: 1
      rhxb-switch-roof: 2
      rhxb-cloudkey: 3

      # PTP
      rhxb-l105: 4
      rhxb-flughafen: 5
      rhxb-manstein: 6
      rhxb-rhnk: 8
      rhxb-technikmuseum: 9
      rhxb-simeon: 14

      # PTMP
      rhxb-no-5ghz: 10
      rhxb-sw-5ghz: 12
      rhxb-so-5ghz: 13
      rhxb-nw-5ghz: 15
      rhxb-dragon: 17
