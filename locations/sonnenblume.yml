---
location: sonnenblume
location_nice: Wohngemeinschaft Sonnenblume
latitude: 52.42718346824063
longitude: 13.480034395635464
altitude: 39
contact_nickname: "jammingblub"
contacts:
  - "koltonowski@protonmail.com"

hosts:
  - hostname: sonnenblume-core
    role: corerouter
    model: "avm_fritzbox-7530"
    wireless_profile: freifunk_default
    host__rclocal__to_merge:
      - |
        # Preserve the FRITZ!Box 7530 port layout verified on 2026-11-19:
        # DHCP (40) and management (42) tagged; uplink (50) untagged on LAN1-4.
        (
          for port in lan1 lan2 lan3 lan4; do
            ip link show dev "$port" >/dev/null 2>&1 || exit 0
          done
          for vlan in 40 42 50; do
            [ "$(uci -q get network.vlan_${vlan})" = 'bridge-vlan' ] &&
              [ "$(uci -q get network.vlan_${vlan}.device)" = 'switch0' ] &&
              [ "$(uci -q get network.vlan_${vlan}.vlan)" = "$vlan" ] || exit 0
          done
          # Skip if network changes are already staged.
          pending_changes="$(uci -q changes network)" || exit 0
          [ -z "$pending_changes" ] || exit 0
          tagged_ports='lan1:t lan2:t lan3:t lan4:t'
          uplink_ports='lan1:u lan2:u lan3:u lan4:u'
          if [ "$(uci -q get network.vlan_40.ports)" != "$tagged_ports" ] ||
            [ "$(uci -q get network.vlan_42.ports)" != "$tagged_ports" ] ||
            [ "$(uci -q get network.vlan_50.ports)" != "$uplink_ports" ]; then
            uci set "network.vlan_40.ports=$tagged_ports" &&
              uci set "network.vlan_42.ports=$tagged_ports" &&
              uci set "network.vlan_50.ports=$uplink_ports" &&
              uci commit network && reload_config
          fi
        )

ipv6_prefix: "2001:bf7:830:a200::/56"

# Sonnenblume got following prefixes:
# Router: 10.31.149.160/27
# --MGMT: 10.31.149.160/28
# --MESH: 10.31.149.176/28
# --DHCP: 10.31.149.192/26

networks:
  - vid: 40
    role: dhcp
    inbound_filtering: true
    enforce_client_isolation: true
    prefix: 10.31.149.192/26
    ipv6_subprefix: 0
    assignments:
      sonnenblume-core: 1

  - vid: 50
    untagged: true
    role: uplink

  - role: tunnel
    ifname: ts_wg0
    mtu: 1280
    prefix: 10.31.149.176/32
    wireguard_port: 51820

  - vid: 42
    role: mgmt
    prefix: 10.31.149.160/28
    gateway: 1
    dns: 1
    ipv6_subprefix: 1
    assignments:
      sonnenblume-core: 1
