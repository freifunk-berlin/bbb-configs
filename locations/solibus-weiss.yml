---
location: solibus-weiss
location_nice: Erkelenzdamm 21, 10999 Berlin
latitude: 52.499843
longitude: 13.414666
contact_nickname: Solibus e.V.
contacts:
  - https://matrix.to/#/#freifunk-solibus:matrix.org

hosts:
  - hostname: solibus-weiss-core
    role: corerouter
    model: cudy_wr3000e-v1
    wireless_profile: solibus

# 10.248.149.0/24
# DHCP: 10.248.149.0/25
# MGMT: 10.248.149.128/26
# UPLK: 10.248.149.192/26

ipv6_prefix: "2001:bf7:810:2f00::/56"

networks:
  # DHCP with filtering and isolation
  - vid: 40
    role: dhcp
    prefix: 10.248.149.0/25
    ipv6_subprefix: 40
    inbound_filtering: true
    enforce_client_isolation: true
    assignments:
      solibus-weiss-core: 1

  # MGMT
  - vid: 42
    role: mgmt
    prefix: 10.248.149.128/26
    gateway: 1
    dns: 1
    ipv6_subprefix: 0
    assignments:
      solibus-weiss-core: 1

  # UPLK - 10.248.149.192/26 as /32
  - vid: 50
    role: uplink
    untagged: true

  - role: tunnel
    ifname: ts_wg0
    mtu: 1280
    prefix: 10.248.149.192/32
    wireguard_port: 51820

location__wireless_profiles__to_merge:
  - name: solibus

    ifaces:
      - mode: ap
        ssid: berlin.freifunk.net
        encryption: none
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: ff

      - mode: ap
        ssid: berlin.freifunk.net Encrypted
        encryption: owe
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: ffowe
        ieee80211w: 2

      - mode: ap
        ssid: solibus-freifunk
        encryption: none
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: ff

      - mode: ap
        ssid: solibus-freifunk Encrypted
        encryption: owe
        network: dhcp
        radio: [11a_standard, 11g_standard]
        ifname_hint: ffowe
        ieee80211w: 2
