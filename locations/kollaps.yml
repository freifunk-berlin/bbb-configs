  - vid: 40
    name: dhcp
    role: dhcp
    prefix: 10.248.121.0/24
    ipv6_subprefix: 0
    inbound_filtering: true
    enforce_client_isolation: true
    assignments:
      kollaps-core: 1

  - vid: 41
    name: p2p
    role: dhcp
    prefix: 10.248.120.128/25
    ipv6_subprefix: 2
    inbound_filtering: false
    enforce_client_isolation: false
    assignments:
      kollaps-core: 1

  - vid: 42
    name: mgmt
    role: mgmt
    prefix: 10.248.120.0/27 # the next /27 is for APs in separate locations
    ipv6_subprefix: 1
    gateway: 1
    dns: 1
    assignments:
      kollaps-core: 1
      kollaps-cloud: 2
      kollaps-app-srv: 3
