---
target: mediatek/filogic
brand_nice: ZyXEL
model_nice: NWA50AX PRO
openwrt_version: 25.12.6

dsa_ports:
  - eth0

wireless_devices:
  - name: 11a_standard
    band: 5g
    htmode_prefix: HE
    path: platform/soc/18000000.wifi+1
    ifname_hint: wlan5
  - name: 11g_standard
    band: 2g
    htmode_prefix: HE
    path: platform/soc/18000000.wifi
    ifname_hint: wlan2
