---
target: "qualcommbe/ipq53xx"
brand_nice: GL.iNet
model_nice: GL-BE9300 (Flint 3)
openwrt_version: snapshot

dsa_ports:
  - lan1
  - lan2
  - lan3
  - lan4
  - wan

# ath12k exposes one PHY with three radios (2.4 / 5 / 6 GHz).
# Use the AHB path + radio index; PCIe paths fail with "PHY is undefined".
wireless_devices:
  - name: 11g_standard
    band: 2g
    htmode_prefix: EHT
    path: platform/soc@0/c000000.wifi
    radio: 0
    ifname_hint: wlan2
  - name: 11a_standard
    band: 5g
    htmode_prefix: EHT
    path: platform/soc@0/c000000.wifi
    radio: 1
    ifname_hint: wlan5
  - name: 11ax_standard
    band: 6g
    htmode_prefix: EHT
    path: platform/soc@0/c000000.wifi
    radio: 2
    ifname_hint: wlan6
