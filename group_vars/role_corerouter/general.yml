---

wireless_profile: disable

adblock_enabled: false
adblock_fast_dns: dnsmasq.servers
adblock_fast_force_dns: false
adblock_fast_gateway_check: none
adblock_fast_ipv6_enabled: true
adblock_fast_procd_boot_wan_timeout: 300
adblock_fast_feeds:
  - name: AdGuard DNS Filter
    url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
  - name: AdGuard CNAME Trackers
    url: https://raw.githubusercontent.com/AdguardTeam/cname-trackers/master/data/combined_disguised_trackers_justdomains.txt
  - name: CERT Polska Dangerous Websites
    url: https://hole.cert.pl/domains/v2/domains.txt

# Recover a PPPoE uplink which doesn't reach the internet anymore: restart
# the interface, then the DSL modem, then the router. Set a time to 0 to skip
# that step.
uplink_watchdog: true
uplink_watchdog_hosts:
  - 9.9.9.9
  - 1.1.1.1
uplink_watchdog_restart_interface: 5m
uplink_watchdog_restart_dsl: 15m
uplink_watchdog_reboot: 1h

role_corerouter__sysctl__to_merge:
  net.netfilter.nf_conntrack_max: 131072
