---
#
# These tasks build /etc contents that will be copied to the target filesystem
# to override the default configs of the respective packages and system parts.
#
# We copy Jinja2 templates (from ../templates) and static files (from ../files).
# Files are simply copied, templates are rendered and then written to /etc.
#
# Rendering is done by the render_tree action plugin (../action_plugins) in a
# single task per tree, as looping the template module over every file is
# slow. It writes directly and thus relies on connection: local.
#
# Symlinks can be used for individual files, but not for directories.
#
# Files and templates keep the permissions they have in git (following
# symlinks). Git only tracks the executable bit, so modes that need to be
# stricter (dropbear) are set explicitly here. Modes must not be fixed up in a
# later task, or every run would report changes.
#
# Possible future additions:
# - ability to remove files, not just to add or change/override them
# - collapse files/ into templates/ and treat everything as a template
#

# The configs of these packages are only written if the package is installed
- name: Render /etc templates and copy /etc static files
  tags: always
  vars:
    package_configs:
      config/adblock-fast: adblock-fast
      config/airos-dfs-reset: airos-dfs-reset
      config/dawn: dawn
      config/naywatch: naywatch
      config/olsrd: olsrd
      config/qos: qos-scripts
      config/qosify: qosify
      config/tunspace: tunspace
      config/umdns: umdns
      config/uneighbord: uneighbord
    installed_packages: >-
      {{ packages | reject('match', '^-') | difference(packages | select('match', '^-')
         | map('regex_replace', '^-', '')) }}
  render_tree:
    templates: "{{ role_path }}/templates/{{ role }}"
    files: "{{ role_path }}/files/{{ role }}"
    dest: "{{ configs_dir }}/etc"
    target: /etc
    modes:
      dropbear: "700"
      dropbear/authorized_keys: "600"
    exclude: "{{ package_configs | dict2items | rejectattr('value', 'in', installed_packages) | map(attribute='key') | list }}"

- name: Copy rootfs static files
  tags: always
  render_tree:
    files: "{{ role_path }}/rootfs/{{ role }}"
    dest: "{{ configs_dir }}"
    target: /
