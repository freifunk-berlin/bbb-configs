---
- name: Include tasks for merging variables
  include_tasks:
    file: merge_vars.yml
    apply:
      tags: always
  tags: always

- name: Find direct internet networks
  set_fact:
    direct_internet_networks: >-
      {{ networks | default([]) | selectattr('direct_internet', 'defined') | selectattr('direct_internet')
         | selectattr('assignments', 'defined') | selectattr('assignments', 'contains', inventory_hostname) | list
         if role == 'corerouter' else [] }}
  tags: always

# An uplink in the root namespace puts its default route into the main
# table. The Freifunk networks then move into the vrf_freifunk VRF, only
# the uplink and networks with direct internet access stay in the main table.
- name: Enable the Freifunk VRF
  set_fact:
    freifunk_vrf: >-
      {{ role == 'corerouter' and networks | default([]) | selectattr('role', 'equalto', 'uplink')
         | selectattr('uplink_mode', 'defined') | selectattr('uplink_mode', 'equalto', 'root') | count > 0 }}
  tags: always

- name: Check the direct internet requirements
  assert:
    that:
      - freifunk_vrf
    fail_msg: "direct_internet needs an uplink with uplink_mode: root"
  when: direct_internet_networks | length > 0
  tags: always

- name: Check the Freifunk VRF requirements
  assert:
    that:
      - bird_only | bool
    fail_msg: "uplink_mode: root needs bird_only: true, OLSR doesn't support the Freifunk VRF"
  when: freifunk_vrf
  tags: always

- name: Keep IPv6 addresses of interfaces moved into the Freifunk VRF
  set_fact:
    sysctl: "{{ sysctl | combine({'net.ipv6.conf.all.keep_addr_on_down': 1}) }}"
  when: freifunk_vrf
  tags: always

- name: Include tasks for conditional packages
  include_tasks:
    file: conditional_packages.yml
    apply:
      tags: always
  tags: always

- name: Prepare some variables (1)
  set_fact:
    basedir: "{{ playbook_dir }}/tmp"
  tags: always

- name: Prepare some variables
  set_fact:
    configs_dir: "{{ basedir }}/configs/{{ inventory_hostname }}"
    dl_dir: "{{ basedir }}/dl/"
    build_dir: "{{ basedir }}/build/{{ inventory_hostname }}"
    images_dir: "{{ basedir }}/images/"
    wikiupdater_dir: "{{ basedir }}/wikiupdater/"
  tags: always

- name: Create images directory
  file:
    state: directory
    path: "{{ images_dir }}"
    mode: "755"
  tags: always

- name: Debug hostvars
  copy:
    dest: "{{ images_dir }}/{{ inventory_hostname }}.json"
    content: "{{ hostvars[inventory_hostname] | dict2items | rejectattr('key', 'eq', 'groups') | items2dict | to_json(indent=2) }}\n"
    mode: "644"
  tags: always

- name: Create configs directory
  file:
    path: "{{ configs_dir }}"
    state: directory
    mode: "755"
  tags:
    - always
    - config

- name: Include render_etc.yml
  include_tasks:
    file: render_etc.yml
    apply:
      tags: always
  tags:
    - always
    - config

- name: Include add_symlinks.yml
  include_tasks:
    file: add_symlinks.yml
    apply:
      tags: always
  tags:
    - always
    - config

- name: Add poemgr config if poemgr target
  template:
    src: "{{ role_path }}/templates/common/config/poemgr.j2"
    dest: "{{ configs_dir }}/etc/config/poemgr"
    mode: "644"
  when:
    - poemgr_ports is defined
  tags:
    - always
    - config

# not part of templates/corerouter, all other corerouters keep the default
# configs of the packages
- name: Add dropbear and bgpdisco config for the Freifunk VRF
  template:
    src: "{{ role_path }}/templates/common/config/{{ item }}.j2"
    dest: "{{ configs_dir }}/etc/config/{{ item }}"
    mode: "644"
  loop:
    - dropbear
    - bgpdisco
  when: freifunk_vrf
  tags:
    - always
    - config

# replaces the link to the resolv.conf written by dnsmasq
- name: Add resolv.conf for the Freifunk VRF
  template:
    src: "{{ role_path }}/templates/common/resolv.conf.j2"
    dest: "{{ configs_dir }}/etc/resolv.conf"
    mode: "644"
  when: freifunk_vrf
  tags:
    - always
    - config

- name: Add hotplug directory for the Freifunk VRF
  file:
    path: "{{ configs_dir }}/etc/hotplug.d/iface"
    state: directory
    mode: "755"
  when: freifunk_vrf
  tags:
    - always
    - config

# The local table is looked up first by default and delivers packets from
# the VRF to all addresses of the router, also to the ones of the uplink
# and the direct internet networks. Look up the VRF table first, as
# described in Documentation/networking/vrf.rst of the kernel. netifd
# restores the default rules when it starts.
- name: Add hotplug script to look up the Freifunk VRF before the local table
  copy:
    content: |
      #!/bin/sh

      [ "$ACTION" = ifup ] && for family in -4 -6; do
          ip "$family" rule | grep -q '^32765:.*lookup local' ||
              ip "$family" rule add pref 32765 lookup local || continue
          while ip "$family" rule del pref 0 lookup local 2>/dev/null; do :; done
      done
    dest: "{{ configs_dir }}/etc/hotplug.d/iface/15-vrf-local-rule"
    mode: "644"
  when: freifunk_vrf
  tags:
    - always
    - config

- name: "Make sure /lib/firmware is present"
  file:
    dest: "{{ configs_dir }}/lib/firmware/ath10k"
    state: directory
    recurse: true
  when: ath10k_ct_fwcfg is defined
  tags:
    - always
    - config

- name: "Configure ath10k-ct driver"
  copy:
    dest: "{{ configs_dir }}/lib/firmware/ath10k/fwcfg-{{ item.id }}.txt"
    content: "{{ item.config }}"
    mode: "644"
  loop: "{{ ath10k_ct_fwcfg | default([]) }}"
  tags:
    - always
    - config

- name: Add fstab config to mount the USB stick for the log
  template:
    src: "{{ role_path }}/templates/common/config/fstab.j2"
    dest: "{{ configs_dir }}/etc/config/fstab"
    mode: "644"
  when: log_usb | default(false) | bool
  tags:
    - always
    - config

- name: Add hotplug directory for the log on the USB stick
  file:
    path: "{{ configs_dir }}/etc/hotplug.d/mount"
    state: directory
    mode: "755"
  when: log_usb | default(false) | bool
  tags:
    - always
    - config

# The log writer keeps a removed stick busy. The stick then gets another
# device name when it is plugged in again and is not mounted.
- name: Add hotplug script to stop the log writer when the USB stick is removed
  copy:
    content: |
      #!/bin/sh

      [ "$ACTION" = remove ] && grep -q "^/dev/$DEVICE /mnt/log " /proc/mounts &&
        ubus call service delete '{ "name": "log", "instance": "logfile" }'
    dest: "{{ configs_dir }}/etc/hotplug.d/mount/10-log"
    mode: "644"
  when: log_usb | default(false) | bool
  tags:
    - always
    - config

- name: Include fix_permissions.yml
  include_tasks:
    file: fix_permissions.yml
    apply:
      tags: always
  tags:
    - always
    - config

- name: Generate Imagebuilder command
  set_fact:
    make_command: >
      make image
      PROFILE='{{ override_target | default(model) }}'
      PACKAGES='{{ packages | join(" ") }}'
      DISABLED_SERVICES='{{ disabled_services | join(" ") }}'
      FILES='{{ configs_dir }}' 1>&2
  tags: always

- name: Debug Imagebuilder command
  debug:
    var: make_command
  tags: always

- name: Include image generation
  include_tasks:
    file: imagebuilder.yml
    apply:
      tags: always
  tags:
    - never
    - image
    - flash

- name: Include image flash
  include_tasks:
    file: flash.yml
    apply:
      tags: always
  tags:
    - never
    - flash
  when: ipv6_prefix is defined

- name: Include wikiupdater
  include_tasks:
    file: wikiupdater.yml
    apply:
      tags: wiki
  when: inventory_hostname in groups['role_corerouter']
  tags:
    - never
    - wiki
