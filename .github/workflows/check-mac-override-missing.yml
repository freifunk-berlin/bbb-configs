---
name: Check missing mac_overrides

on: [push, pull_request]
permissions:
  contents: read
  actions: read

jobs:
  check-mac-override-missing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Get a list of changed files and pass them to the script
      - name: Get Changed Files and Run mac_override missing check
        run: |
          # Fetch previous commits for comparison
          git fetch origin main

          # Get the location files changed compared to the main branch
          mapfile -t location_files < <(git diff --name-only --diff-filter=d origin/main | grep -E '^locations/.*\.yml$' || true)

          if [ ${#location_files[@]} -eq 0 ]; then
            echo "No location files changed, skipping check."
            exit 0
          fi

          # Run the mac_override check script with the changed location files
          ./.github/checks/check-mac-override-missing.sh "${location_files[@]}"
