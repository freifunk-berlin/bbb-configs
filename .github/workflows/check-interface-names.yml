---
name: Check interface names

on: [push, pull_request]
permissions:
  contents: read
  actions: read

jobs:
  check-interface-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Get a list of changed files and pass them to the script
      - name: Get Changed Files and Run interface name check
        run: |
          # Fetch previous commits for comparison
          git fetch origin main

          # Get the location files changed compared to the main branch
          mapfile -t location_files < <(git diff --name-only --diff-filter=d origin/main | grep -E '^locations/.*\.yml$' || true)

          if [ ${#location_files[@]} -eq 0 ]; then
            echo "No location files changed, skipping check."
            exit 0
          fi

          # Run the interface name check script with the changed location files
          ./.github/checks/check-interface-names.sh "${location_files[@]}"
